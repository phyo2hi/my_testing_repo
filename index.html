<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Your information form</h2>
    <form action="">
        <label for="name">Enter your name</label>
        <input type="text" name="" id="name">
        <br><br>
         <h3>Choose the language you are good at!</h3>
         <select name="" id="">
            <optgroup label="languages">
            <option value="english">English</option>
            <option value="english">Myanmar</option>
            <option value="english">Japan</option></optgroup>
         </select>

         <h3>Range your programming level</h3>
         <span><label for="">HTML</label><br>
         <input type="range" name="" id=""min="0" max="10"></span><br>
         <div><label for="">CSS</label><br>
         <input type="range" name="" id=""min="0" max="10"></div><br>
         <span><label for="">Javascript</label><br>
         <input type="range" name="" id=""min="0" max="10"></span>
         <br><h3>Choose your gender.</h3>
         <input type="radio" name="gender" id=""><label for="gender">Male</label><br>
         <input type="radio" name="gender" id=""><label for="gender">female</label><br>
         <h3>Enter your age</h3>
         <input type="number" name="age" id="age">
         <legend>Address</legend>
         <br><br>
         <fieldset>
            <textarea name="address" id="address" placeholder="Enter your detail address"></textarea>
         </fieldset><br>
         <input type="button" value="Submit">
         <hr>
        

    </form>


</body>
</html>
